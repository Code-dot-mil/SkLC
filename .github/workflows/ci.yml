name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  bundle-assessments:
    name: Main bundle assessments
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: bundle-assessments-main
      cancel-in-progress: false
    env: &assessment-provider
      SKILL_ASSESSMENT_BASE_DIR: ${{ github.workspace }}
      SKILLSPECTOR_PROVIDER: ${{ vars.SKILLSPECTOR_PROVIDER }}
      SKILLSPECTOR_MODEL: ${{ vars.SKILLSPECTOR_MODEL }}
      SKILLSPECTOR_COMPAT_BASE_URL: ${{ vars.SKILLSPECTOR_COMPAT_BASE_URL }}
      SKILLSPECTOR_COMPAT_API_KEY: ${{ secrets.SKILLSPECTOR_COMPAT_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      SCANNER_SOURCE: ${{ vars.SCANNER_SOURCE }}
      SSL_CERT_FILE: ${{ vars.RUNNER_CA_BUNDLE_PATH }}
      NODE_EXTRA_CA_CERTS: ${{ vars.RUNNER_CA_BUNDLE_PATH }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GITHUB_TOKEN pushes do not trigger another push workflow.
          token: ${{ github.token }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install assessment runtime
        run: &install-scanner |
          : "${SCANNER_SOURCE:?Set the SCANNER_SOURCE Actions variable}"
          python -m pip install --no-cache-dir uv
          uv venv --clear --python "$(command -v python)" "$RUNNER_TEMP/skillspector"
          GIT_SSL_CAINFO="$SSL_CERT_FILE" uv pip install --python "$RUNNER_TEMP/skillspector/bin/python" "$SCANNER_SOURCE"
          echo "$RUNNER_TEMP/skillspector/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/skillspector/bin/skillspector" --version
      - name: Select bundle skills
        run: >-
          PYTHONPATH=maintainer/src python -m sklc_maintainer.assessments select
          --skills products/skill-bundle --output-dir "$RUNNER_TEMP/bundle-selection"
      - name: Assess bundle skills
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: >-
          PYTHONPATH=maintainer/src uv run --with ./products/assessment-kit
          python -m sklc_maintainer.assessments assess
          --selection "$RUNNER_TEMP/bundle-selection/current-skills.nul"
          --reports products/skill-bundle-assessments --before-sha "$BEFORE_SHA"
      - name: Prune obsolete assessment reports after successful scans
        run: >-
          PYTHONPATH=maintainer/src python -m sklc_maintainer.assessments prune
          --selection "$RUNNER_TEMP/bundle-selection/current-skills.nul"
          --reports products/skill-bundle-assessments
      - name: Commit current assessments
        shell: bash
        run: |
          pairs=(
            ':(glob)products/skill-bundle-assessments/*/skillspector.json'
            ':(glob)products/skill-bundle-assessments/*/adjudication.json'
          )
          matching=$(git ls-files --cached --others --exclude-standard -- "${pairs[@]}")
          if [[ -n "$matching" ]]; then
            git add --all -- "${pairs[@]}"
          fi
          if ! git diff --cached --quiet -- "${pairs[@]}"; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --only -m 'chore(assessments): record current bundle assessments' -- "${pairs[@]}"
            git push origin HEAD:main
          fi
      - name: Retain assessments and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-assessments
          path: products/skill-bundle-assessments/
          if-no-files-found: warn
          include-hidden-files: true

  pr-assessment-notice:
    name: Fork assessment notice
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped provider assessment
        run: >-
          printf '%s\n' 'LLM assessment skipped: fork pull requests do not receive provider credentials or run on the assessment runner.'
          >> "$GITHUB_STEP_SUMMARY"

  pr-assessments:
    name: PR assessment review
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 60
    env: *assessment-provider
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python for skill selection
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Select changed skill packages
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          root="$RUNNER_TEMP/pr-assessments"
          PYTHONPATH=maintainer/src python -m sklc_maintainer.assessments select \
            --skills products/skill-bundle --output-dir "$root" --base-sha "$BASE_SHA"
          if test -s "$root/current-skills.nul"; then
            printf 'assess=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'assess=false\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'No current skill packages changed; no provider assessment requested.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install assessment runtime for changed skills
        if: steps.changes.outputs.assess == 'true'
        run: *install-scanner
      - name: Assess changed skills for review
        id: assess
        if: steps.changes.outputs.assess == 'true'
        run: >-
          PYTHONPATH=maintainer/src uv run --with ./products/assessment-kit
          python -m sklc_maintainer.assessments assess
          --selection "$RUNNER_TEMP/pr-assessments/current-skills.nul"
          --reports "$RUNNER_TEMP/pr-assessments/reports" --keep-going
      - name: Summarize findings and required actions
        if: always() && steps.changes.outputs.assess == 'true'
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.assess.outcome }}
        run: |
          root="$RUNNER_TEMP/pr-assessments"
          printf '%s\n' 'Assessment summary could not run; inspect retained diagnostics.' > "$root/summary.md"
          result=0
          PYTHONPATH=maintainer/src uv run --with ./products/assessment-kit \
            python -m sklc_maintainer.assessments summarize \
            --reports "$root/reports" --output-dir "$root" \
            --scan-outcome "$SCAN_OUTCOME" || result=$?
          cat "$root/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Upload temporary PR assessments and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-assessments
          path: ${{ runner.temp }}/pr-assessments/
          if-no-files-found: warn
          include-hidden-files: true

  python:
    name: "${{ matrix.check }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Python lint
            command: uv run --extra test ruff check maintainer products
          - check: Python test
            command: uv run --extra test pytest
          - check: GitLab scripts
            command: |
              staging=$(mktemp -d)
              trap 'rm -rf "$staging"' EXIT
              mkdir -p "$staging/operator/ci"
              cp products/deployment-kit/operator/ci/gitlab/.gitlab-ci.yml "$staging/operator/"
              cp products/deployment-kit/operator/ci/gitlab/assessment.yml "$staging/operator/ci/"
              result=0
              for config in \
                  products/deployment-kit/operator/ci/gitlab/assessment.yml \
                  products/deployment-kit/prebuilt/ci/gitlab/.gitlab-ci.yml; do
                  uv run --frozen --group lint gitlab-ci-verify --no-lint-api --gitlab-ci-file "$config" || result=$?
              done
              uv run --project "$PWD" --directory "$staging/operator" --frozen --group lint \
                  gitlab-ci-verify --no-lint-api --gitlab-ci-file .gitlab-ci.yml || result=$?
              exit "$result"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --no-cache-dir uv
      - name: Run check
        run: ${{ matrix.command }}

  skill-bundle:
    name: Skill bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python for packaging
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the skill bundle ZIP
        run: PYTHONPATH=maintainer/src python -m sklc_maintainer.packaging bundle --output "$RUNNER_TEMP/skill-bundle.zip"
      - name: Upload skill bundle download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/skill-bundle.zip
          archive: false
          if-no-files-found: error

  site:
    name: "Site ${{ matrix.check }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: npm --prefix products/deployment-kit/operator/site run lint
          - check: eslint
            command: npm --prefix products/deployment-kit/operator/site run lint:code
          - check: astro
            command: npm --prefix products/deployment-kit/operator/site run typecheck:astro
          - check: test
            command: npm --prefix products/deployment-kit/operator/site run test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=22.23.4 <23"
      - name: Install site dependencies
        run: npm ci --prefix products/deployment-kit/operator/site
      - name: Run check
        run: ${{ matrix.command }}

  markdown:
    name: "Markdown ${{ matrix.check }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: npm run markdown:lint
          - check: format
            command: npm run markdown:check
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=22.23.4 <23"
      - name: Install Markdown dependencies
        run: npm ci
      - name: Run check
        run: ${{ matrix.command }}

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install actionlint and verify ShellCheck
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          shellcheck --version
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint \
            --pattern "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --pattern "actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            --dir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          sha256sum --check --ignore-missing "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          printf '%s\n' "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Check workflows and embedded shell
        run: actionlint

  exchange-data:
    name: Static site exchange data
    needs: [bundle-assessments, pr-assessments]
    if: >-
      always() && !cancelled() &&
      (needs.bundle-assessments.result == 'success' || needs.pr-assessments.result == 'success' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --no-cache-dir uv
      - name: Stage tracked current assessments
        run: |
          mkdir -p "$RUNNER_TEMP/current-assessments"
          cp -R products/skill-bundle-assessments/. "$RUNNER_TEMP/current-assessments/"
      - name: Download main assessment output
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-assessments
          path: ${{ runner.temp }}/current-assessments
      - name: Download trusted PR assessment output
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-assessments
          path: ${{ runner.temp }}/pr-assessments
      - name: Replace changed PR reports in the staged current set
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          while IFS= read -r -d '' skill; do
            name=${skill##*/}
            rm -rf -- "$RUNNER_TEMP/current-assessments/$name"
            cp -R "$RUNNER_TEMP/pr-assessments/reports/$name" "$RUNNER_TEMP/current-assessments/$name"
          done < "$RUNNER_TEMP/pr-assessments/current-skills.nul"
      - name: Generate preview exchange data
        run: >-
          uv run python -m skill_exchange.cli generate
          --skills products/skill-bundle
          --generated .exchange/generated
          --evidence "$RUNNER_TEMP/current-assessments"
      - name: Verify exchange data
        run: |
          test -s .exchange/generated/index.json
          test -n "$(find .exchange/generated/assessments -type f -name 'adjudication.json' -print -quit)"
          test -n "$(find .exchange/generated/zips -type f -name '*.zip' -print -quit)"
      - name: Build operator kit preview
        run: |
          PYTHONPATH=maintainer/src python -m sklc_maintainer.packaging bundle --output "$RUNNER_TEMP/operator-bundle.zip"
          PYTHONPATH=maintainer/src uv run python -m sklc_maintainer.packaging assessments --output "$RUNNER_TEMP/skill-bundle-assessments.zip" \
            --source-dir "$RUNNER_TEMP/current-assessments"
          uv build --wheel --python 3.12 products/assessment-kit --out-dir "$RUNNER_TEMP/operator"
          version=$(python -c 'import tomllib; print(tomllib.load(open("products/assessment-kit/pyproject.toml", "rb"))["project"]["version"])')
          uv run python -m sklc_maintainer.packaging operator --version "$version" \
            --bundle "$RUNNER_TEMP/operator-bundle.zip" \
            --assessments "$RUNNER_TEMP/skill-bundle-assessments.zip" --wheel "$RUNNER_TEMP"/operator/*.whl \
            --output-dir "$RUNNER_TEMP/operator"
      - name: Upload operator kit preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/operator/deployment-kit-operator-*.zip
          archive: false
          if-no-files-found: error

      - name: Upload assessment wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/operator/*.whl
          archive: false
          if-no-files-found: error

      - name: Upload current assessment download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/skill-bundle-assessments.zip
          archive: false
          if-no-files-found: error

      - name: Upload exchange data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-site-exchange-data
          path: |
            .exchange/generated/index.json
            .exchange/generated/assessments/
            .exchange/generated/zips/
          if-no-files-found: error
          include-hidden-files: true

  static-site:
    name: Static site artifact
    if: >-
      always() && !cancelled() &&
      needs.exchange-data.result == 'success' &&
      needs.python.result == 'success' && needs.site.result == 'success' &&
      needs.markdown.result == 'success' && needs.workflows.result == 'success'
    needs:
      - exchange-data
      - python
      - site
      - markdown
      - workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download exchange data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site-exchange-data
          path: .exchange/generated
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=22.23.4 <23"
      - name: Install site dependencies
        run: npm ci --prefix products/deployment-kit/operator/site
      - name: Build static site
        run: SKILL_EXCHANGE_GENERATED_ROOT="$GITHUB_WORKSPACE/.exchange/generated" npm --prefix products/deployment-kit/operator/site run build
      - name: Set up Python for packaging
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Stage prebuilt site
        env:
          PYTHONPATH: maintainer/src
        run: >-
          python -m sklc_maintainer.packaging prebuilt --stage
          --repo-root . --site-dir products/deployment-kit/operator/site/dist
          --output-dir "$RUNNER_TEMP/static-site"
      - name: Upload static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-site
          path: ${{ runner.temp }}/static-site/
          if-no-files-found: error
          include-hidden-files: true

  github-pages:
    name: Deploy GitHub Pages
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.static-site.result == 'success'
    needs: static-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download checked Prebuilt site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site
          path: ${{ runner.temp }}/prebuilt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload rendered Prebuilt site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/prebuilt/public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
