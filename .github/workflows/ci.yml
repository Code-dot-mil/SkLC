name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python:
    name: "Python ${{ matrix.check }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: uv run --extra test ruff check maintainer tests
          - check: test
            command: uv run --extra test pytest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --no-cache-dir uv
      - name: Run check
        run: ${{ matrix.command }}

  skill-catalog:
    name: Skill catalog and BOE artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble skill catalog and BOE
        run: |
          test -z "$(find products/skill-catalog/skills/ai4sdlc maintainer/exchange/generated/boe/ai4sdlc -type l -print -quit)"
          mkdir -p skill-catalog/skills
          mkdir -p skill-catalog/.exchange/generated/boe
          cp -R products/skill-catalog/skills/ai4sdlc/. skill-catalog/skills/
          cp -R maintainer/exchange/generated/boe/ai4sdlc/. skill-catalog/.exchange/generated/boe/
          test -n "$(find skill-catalog/skills -mindepth 2 -maxdepth 2 -name SKILL.md -print -quit)"
          test -n "$(find skill-catalog/.exchange/generated/boe -name boe.json -print -quit)"
          test -z "$(find skill-catalog/.exchange -mindepth 1 -maxdepth 1 ! -name generated -print -quit)"
          test -z "$(find skill-catalog/.exchange/generated -mindepth 1 -maxdepth 1 ! -name boe -print -quit)"
          test ! -e skill-catalog/skills/ai4sdlc
          test ! -e skill-catalog/.exchange/generated/boe/ai4sdlc
      - name: Upload skill catalog and BOE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-catalog-and-boe
          path: skill-catalog/
          if-no-files-found: error
          include-hidden-files: true

  site:
    name: "Site ${{ matrix.check }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: npm --prefix products/deployment-kit/site run lint
          - check: test
            command: npm --prefix products/deployment-kit/site run test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install site dependencies
        run: npm ci --prefix products/deployment-kit/site
      - name: Run check
        run: ${{ matrix.command }}

  exchange-data:
    name: Static site exchange data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKILL_EXCHANGE_SOURCE_REPOSITORY_URL: "${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}"
      SKILL_EXCHANGE_SOURCE_BRANCH: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --no-cache-dir uv
      - name: Generate exchange data from tracked BOE
        run: >-
          uv run python -m skill_exchange.cli publish-local
          --generated-dir maintainer/exchange/generated
          --scan-mode static-only
          --reuse-boe-only
      - name: Verify exchange data
        run: |
          test -s maintainer/exchange/generated/index.json
          test -n "$(find maintainer/exchange/generated/skills -type f -name '*.json' -print -quit)"
          test -n "$(find maintainer/exchange/generated/zips -type f -name '*.zip' -print -quit)"
          ! grep -R -q 'https://example.invalid' maintainer/exchange/generated/index.json maintainer/exchange/generated/skills
      - name: Upload exchange data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-site-exchange-data
          path: |
            maintainer/exchange/generated/index.json
            maintainer/exchange/generated/skills/
            maintainer/exchange/generated/tables/
            maintainer/exchange/generated/scanner-runs/
            maintainer/exchange/generated/zips/
          if-no-files-found: error
          include-hidden-files: true

  static-site:
    name: Static site artifact
    needs:
      - exchange-data
      - python
      - site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exchange data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site-exchange-data
          path: maintainer/exchange/generated
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install site dependencies
        run: npm ci --prefix products/deployment-kit/site
      - name: Build static site
        env:
          SKILL_EXCHANGE_GENERATED_ROOT: "${{ github.workspace }}/maintainer/exchange/generated"
        run: npm --prefix products/deployment-kit/site run build
      - name: Add prebuilt deployment files
        run: |
          rm -f products/deployment-kit/site/dist/.gitkeep
          cp products/deployment-kit/prebuilt/.gitlab-ci.yml products/deployment-kit/site/dist/.gitlab-ci.yml
          cp products/deployment-kit/prebuilt/README.md products/deployment-kit/site/dist/README.md
      - name: Verify standalone site
        run: |
          test -s products/deployment-kit/site/dist/index.html
          test -n "$(find products/deployment-kit/site/dist/skills -type f -name 'index.html' -print -quit)"
          test -n "$(find products/deployment-kit/site/dist/downloads -type f -name '*.zip' -print -quit)"
          test -s products/deployment-kit/site/dist/.gitlab-ci.yml
          test -s products/deployment-kit/site/dist/README.md
          test ! -e products/deployment-kit/site/dist/.gitkeep
      - name: Upload static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-site
          path: products/deployment-kit/site/dist/
          if-no-files-found: error
          include-hidden-files: true
