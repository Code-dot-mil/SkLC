name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python:
    name: "Python ${{ matrix.check }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: uv run --extra test ruff check scripts tests products/assessment-kit
          - check: test
            command: uv run --extra test pytest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --no-cache-dir uv
      - name: Run check
        run: ${{ matrix.command }}

  skill-catalog:
    name: Skill catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the skill catalog ZIP
        run: bash scripts/package-skill-catalog.sh "$RUNNER_TEMP/skill-catalog.zip"
      - name: Upload skill catalog download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/skill-catalog.zip
          archive: false
          if-no-files-found: error

  site:
    name: "Site ${{ matrix.check }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: npm --prefix site run lint
          - check: test
            command: npm --prefix site run test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install site dependencies
        run: npm ci --prefix site
      - name: Run check
        run: ${{ matrix.command }}

  exchange-data:
    name: Static site exchange data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKILL_EXCHANGE_SOURCE_REPOSITORY_URL: "${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}"
      SKILL_EXCHANGE_SOURCE_BRANCH: "${{ github.event.pull_request.head.sha || github.sha }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --no-cache-dir uv
      - name: Generate preview exchange data
        run: >-
          uv run python -m skill_exchange.cli publish-local
          --generated-dir .exchange/generated
          --scan-mode static-only
      - name: Verify exchange data
        run: |
          test -s .exchange/generated/index.json
          test -n "$(find .exchange/generated/skills -type f -name '*.json' -print -quit)"
          test -n "$(find .exchange/generated/zips -type f -name '*.zip' -print -quit)"
          ! grep -R -q 'https://example.invalid' .exchange/generated/index.json .exchange/generated/skills
      - name: Upload exchange data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-site-exchange-data
          path: |
            .exchange/generated/index.json
            .exchange/generated/skills/
            .exchange/generated/tables/
            .exchange/generated/scanner-runs/
            .exchange/generated/zips/
          if-no-files-found: error
          include-hidden-files: true

  static-site:
    name: Static site artifact
    needs:
      - exchange-data
      - python
      - site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exchange data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site-exchange-data
          path: .exchange/generated
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install site dependencies
        run: npm ci --prefix site
      - name: Build static site
        run: npm --prefix site run build
      - name: Set up Python for packaging
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Stage prebuilt site
        env:
          PYTHONPATH: scripts
        run: >-
          python -m skill_exchange.release stage
          --repo-root . --site-dir site/dist
          --output-dir "$RUNNER_TEMP/static-site"
      - name: Upload static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-site
          path: ${{ runner.temp }}/static-site/
          if-no-files-found: error
          include-hidden-files: true
