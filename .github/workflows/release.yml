name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    name: Build draft release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONPATH: scripts
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate tag and accepted release notes
        id: release-inputs
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m skill_exchange.release validate-version --version "$version"
          source_revision="$(git rev-parse HEAD)"
          release_dir="$(mktemp -d "$RUNNER_TEMP/sklc-release.XXXXXX")"
          python -m skill_exchange.release release-notes \
            --version "$version" --notes-file RELEASE_NOTES.md \
            --output "$release_dir/release-body.md"
          printf 'RELEASE_VERSION=%s\nSOURCE_REVISION=%s\nRELEASE_DIR=%s\n' \
            "$version" "$source_revision" "$release_dir" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir uv
          npm ci --prefix site
      - name: Run repository checks
        run: |
          uv run --extra test ruff check scripts tests products/assessment-kit
          uv run --extra test pytest
          npm --prefix site run lint
          npm --prefix site run test
      - name: Generate exchange data from tracked BOE
        env:
          SKILL_EXCHANGE_SOURCE_REPOSITORY_URL: "${{ github.server_url }}/${{ github.repository }}"
          SKILL_EXCHANGE_SOURCE_BRANCH: "${{ env.SOURCE_REVISION }}"
        run: >-
          uv run python -m skill_exchange.cli publish-local
          --generated-dir .exchange/generated
          --scan-mode static-only
      - name: Build static site
        run: npm --prefix site run build
      - name: Build product archives
        id: release-assets
        shell: bash
        run: |
          bash scripts/package-skill-catalog.sh "$RELEASE_DIR/assets/skill-catalog-$RELEASE_VERSION.zip"
          python -m skill_exchange.release build \
            --repo-root . --site-dir site/dist \
            --version "$RELEASE_VERSION" \
            --output-dir "$RELEASE_DIR/assets"
      - name: Create draft GitHub Release
        id: draft-release
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          prerelease_args=()
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_DIR/assets/deployment-kit-prebuilt-$RELEASE_VERSION.zip" \
            "$RELEASE_DIR/assets/skill-catalog-$RELEASE_VERSION.zip" \
            --verify-tag --draft --target "$SOURCE_REVISION" --title "$GITHUB_REF_NAME" \
            --notes-file "$RELEASE_DIR/release-body.md" \
            "${prerelease_args[@]}"
