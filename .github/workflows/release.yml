name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release products
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONPATH: scripts
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate tag and accepted release notes
        id: release-inputs
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          case "$GITHUB_REF_NAME" in v*) ;; *) exit 1 ;; esac
          version="${GITHUB_REF_NAME#v}"
          python -m skill_exchange.release validate-version --version "$version"
          source_revision="$(git rev-parse HEAD)"
          test "$source_revision" = "$(git rev-parse "${GITHUB_REF}^{commit}")"
          git ls-files --error-unmatch RELEASE_NOTES.md > /dev/null
          git diff --exit-code HEAD -- RELEASE_NOTES.md
          release_dir="$(mktemp -d "$RUNNER_TEMP/sklc-release.XXXXXX")"
          python -m skill_exchange.release release-notes \
            --version "$version" --notes-file RELEASE_NOTES.md \
            --output "$release_dir/release-body.md"
          source_date_epoch="$(git show -s --format=%ct "$source_revision")"
          created_at="$(python -c 'from datetime import UTC, datetime; import sys; print(datetime.fromtimestamp(int(sys.argv[1]), UTC).isoformat().replace("+00:00", "Z"))' "$source_date_epoch")"
          printf 'RELEASE_VERSION=%s\nSOURCE_REVISION=%s\nSOURCE_DATE_EPOCH=%s\nCREATED_AT=%s\nRELEASE_DIR=%s\n' \
            "$version" "$source_revision" "$source_date_epoch" "$created_at" "$release_dir" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir uv "packaging>=25.0"
          npm ci --prefix site
      - name: Run repository checks
        run: |
          uv run --extra test ruff check scripts tests products/deployment-kit/scripts/verify_prebuilt.py
          uv run --extra test ruff check products/assessment-kit/src \
            products/assessment-kit/tests products/assessment-kit/release_tools
          uv run --extra test pytest
          npm --prefix site run lint
          npm --prefix site run test
      - name: Generate exchange data from tracked BOE
        env:
          SKILL_EXCHANGE_SOURCE_REPOSITORY_URL: "${{ github.server_url }}/${{ github.repository }}"
          SKILL_EXCHANGE_SOURCE_BRANCH: "${{ env.SOURCE_REVISION }}"
        run: >-
          uv run python -m skill_exchange.cli publish-local
          --generated-dir .exchange/generated
          --scan-mode static-only
          --reuse-boe-only
      - name: Build static site
        run: npm --prefix site run build
      - name: Build assessment kit wheel
        shell: bash
        run: |
          cp -R products/assessment-kit "$RELEASE_DIR/assessment-kit-source"
          cd "$RELEASE_DIR/assessment-kit-source"
          uv version "$RELEASE_VERSION" --frozen
          uv build --no-sources --wheel --out-dir "$RELEASE_DIR/wheels"
      - name: Build and verify release assets
        id: release-assets
        shell: bash
        run: |
          repository_root="$PWD"
          python -m skill_exchange.release build \
            --repo-root . --site-dir site/dist \
            --version "$RELEASE_VERSION" --source-revision "$SOURCE_REVISION" \
            --output-dir "$RELEASE_DIR/assets"
          mkdir "$RELEASE_DIR/extracted"
          tar -xzf "$RELEASE_DIR/assets/deployment-kit-prebuilt-$RELEASE_VERSION.tar.gz" \
            -C "$RELEASE_DIR/extracted"
          cd "$RELEASE_DIR/extracted/deployment-kit-prebuilt-$RELEASE_VERSION"
          python3 -I -S scripts/verify_prebuilt.py . --expected-version "$RELEASE_VERSION"
          test -s public/index.html
          test -n "$(find public/skills -type f -name 'index.html' -print -quit)"
          test -n "$(find public/downloads -type f -name '*.zip' -print -quit)"
          test ! -e public/.gitkeep
          cd "$RELEASE_DIR/assets"
          sha256sum --strict --check \
            "deployment-kit-prebuilt-$RELEASE_VERSION.SHA256SUMS.txt"
          set -- "$RELEASE_DIR/wheels"/skill_assessment-*-py3-none-any.whl
          test "$#" -eq 1
          assessment_wheel="$1"
          test -f "$assessment_wheel"
          cd "$repository_root"
          python products/assessment-kit/release_tools/build.py \
            --repository-root "$repository_root" --version "$RELEASE_VERSION" \
            --source-revision "$SOURCE_REVISION" --created-at "$CREATED_AT" \
            --wheel "$assessment_wheel" --output-directory "$RELEASE_DIR/assets"
          tar -xzf "$RELEASE_DIR/assets/assessment-kit-$RELEASE_VERSION.tar.gz" \
            -C "$RELEASE_DIR/extracted"
          cmp "$RELEASE_DIR/assets/assessment-kit-$RELEASE_VERSION.release-manifest.json" \
            "$RELEASE_DIR/extracted/assessment-kit-$RELEASE_VERSION/release-manifest.json"
          cd "$RELEASE_DIR/assets"
          sha256sum --strict --check \
            "assessment-kit-$RELEASE_VERSION.SHA256SUMS.txt"
          cd "$RELEASE_DIR/extracted/assessment-kit-$RELEASE_VERSION"
          sha256sum --strict --check SHA256SUMS.txt
      - name: Install and exercise released assessment kit
        shell: bash
        run: |
          assessment_root="$RELEASE_DIR/extracted/assessment-kit-$RELEASE_VERSION"
          assessment_env="$RELEASE_DIR/assessment-venv"
          uv venv "$assessment_env" --python 3.12
          set -- "$assessment_root/dist"/skill_assessment-*-py3-none-any.whl
          test "$#" -eq 1
          test -f "$1"
          uv pip install --python "$assessment_env/bin/python" \
            "$1" \
            "skillspector @ git+https://github.com/NVIDIA/SkillSpector.git@e29b16d305b0e738e3d4b952ba102f5522a6f084"
          SKLC_TEST_INSTALLED_CLI="$assessment_env/bin/skill-assessment" \
            SKLC_TEST_RELEASE_ROOT="$assessment_root" \
            uv run --extra test pytest -q products/assessment-kit/tests/test_installed_cli.py
      - name: Create GitHub Release
        id: publish-release
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          prerelease_args=()
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_DIR/assets/deployment-kit-prebuilt-$RELEASE_VERSION.tar.gz" \
            "$RELEASE_DIR/assets/deployment-kit-prebuilt-$RELEASE_VERSION.release-manifest.json" \
            "$RELEASE_DIR/assets/deployment-kit-prebuilt-$RELEASE_VERSION.SHA256SUMS.txt" \
            "$RELEASE_DIR/assets/assessment-kit-$RELEASE_VERSION.tar.gz" \
            "$RELEASE_DIR/assets/assessment-kit-$RELEASE_VERSION.release-manifest.json" \
            "$RELEASE_DIR/assets/assessment-kit-$RELEASE_VERSION.SHA256SUMS.txt" \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RELEASE_DIR/release-body.md" \
            "${prerelease_args[@]}"
