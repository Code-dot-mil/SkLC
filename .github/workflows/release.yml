name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    name: Build draft release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONPATH: maintainer/src
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate tag and accepted release notes
        id: release-inputs
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m sklc_maintainer.release validate-version --version "$version"
          source_revision="$(git rev-parse HEAD)"
          release_dir="$(mktemp -d "$RUNNER_TEMP/sklc-release.XXXXXX")"
          python -m sklc_maintainer.release release-notes \
            --version "$version" --notes-file RELEASE_NOTES.md \
            --output "$release_dir/release-body.md"
          printf 'RELEASE_VERSION=%s\nSOURCE_REVISION=%s\nRELEASE_DIR=%s\n' \
            "$version" "$source_revision" "$release_dir" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=22.23.4 <23"
      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir uv
          npm ci --prefix products/deployment-kit/operator/site
      - name: Run repository checks
        run: |
          uv run --extra test ruff check maintainer products
          uv run --extra test pytest
          npm --prefix products/deployment-kit/operator/site run lint
          npm --prefix products/deployment-kit/operator/site run test
      - name: Generate exchange data from current assessments
        run: >-
          uv run python -m skill_exchange.cli generate
          --skills products/skill-bundle
          --evidence products/skill-bundle-assessments
          --generated .exchange/generated
      - name: Build static site
        run: SKILL_EXCHANGE_GENERATED_ROOT="$GITHUB_WORKSPACE/.exchange/generated" npm --prefix products/deployment-kit/operator/site run build
      - name: Build product downloads
        id: release-assets
        shell: bash
        run: |
          PYTHONPATH=maintainer/src python -m sklc_maintainer.packaging bundle --output "$RELEASE_DIR/assets/skill-bundle-$RELEASE_VERSION.zip"
          PYTHONPATH=maintainer/src python -m sklc_maintainer.packaging assessments --output "$RELEASE_DIR/assets/skill-bundle-assessments-$RELEASE_VERSION.zip"
          python -m sklc_maintainer.packaging prebuilt \
            --repo-root . --site-dir products/deployment-kit/operator/site/dist \
            --version "$RELEASE_VERSION" \
            --output-dir "$RELEASE_DIR/assets"
      - name: Build assessment wheel
        shell: bash
        run: |
          uv build --wheel --python "$(command -v python)" \
            products/assessment-kit --out-dir "$RELEASE_DIR/assets"
      - name: Build operator kit
        run: >-
          uv run python -m sklc_maintainer.packaging operator --version "$RELEASE_VERSION"
          --bundle "$RELEASE_DIR/assets/skill-bundle-$RELEASE_VERSION.zip"
          --assessments "$RELEASE_DIR/assets/skill-bundle-assessments-$RELEASE_VERSION.zip"
          --wheel "$RELEASE_DIR"/assets/*.whl --output-dir "$RELEASE_DIR/assets"
      - name: Create draft GitHub Release
        id: draft-release
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          prerelease_args=()
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_DIR/assets/deployment-kit-prebuilt-$RELEASE_VERSION.zip" \
            "$RELEASE_DIR/assets/deployment-kit-operator-$RELEASE_VERSION.zip" \
            "$RELEASE_DIR/assets/skill-bundle-$RELEASE_VERSION.zip" \
            "$RELEASE_DIR/assets/skill-bundle-assessments-$RELEASE_VERSION.zip" \
            "$RELEASE_DIR"/assets/*.whl \
            --verify-tag --draft --target "$SOURCE_REVISION" --title "$GITHUB_REF_NAME" \
            --notes-file "$RELEASE_DIR/release-body.md" \
            "${prerelease_args[@]}"
