name: SkillSpector

on:
  pull_request:
    branches: ["main"]
    paths:
      - "skills/**"
  push:
    branches: ["main"]
    paths:
      - "skills/**"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "skillspector-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  review:
    name: Review changed skills
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      SKILL_EXCHANGE_REVIEW_SCAN_MODE: "${{ github.event.pull_request.head.repo.full_name == github.repository && 'llm-assisted' || 'static-only' }}"
      SKILL_EXCHANGE_REVIEW_FAIL_ON_VALIDATION_ERRORS: "true"
      SKILL_EXCHANGE_REVIEW_FAIL_ON_SCANNER_ERROR: "true"
      SKILL_EXCHANGE_LLM_API_KEY: "${{ secrets.SKILL_EXCHANGE_LLM_API_KEY }}"
      SKILL_EXCHANGE_LLM_BASE_URL: "${{ vars.SKILL_EXCHANGE_LLM_BASE_URL }}"
      SKILL_EXCHANGE_LLM_MODEL: "${{ vars.SKILL_EXCHANGE_LLM_MODEL }}"
      SKILL_EXCHANGE_LLM_PROVIDER: "${{ vars.SKILL_EXCHANGE_LLM_PROVIDER }}"
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --no-cache-dir uv
      - name: Validate LLM gateway configuration
        if: env.SKILL_EXCHANGE_REVIEW_SCAN_MODE == 'llm-assisted'
        run: |
          required=(
            SKILL_EXCHANGE_LLM_API_KEY
            SKILL_EXCHANGE_LLM_BASE_URL
            SKILL_EXCHANGE_LLM_MODEL
            SKILL_EXCHANGE_LLM_PROVIDER
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions configuration is missing: ${name}"
              exit 1
            fi
          done
          if [ "$SKILL_EXCHANGE_LLM_PROVIDER" != "openai_compatible" ]; then
            echo "::error::SKILL_EXCHANGE_LLM_PROVIDER must be openai_compatible for this workflow"
            exit 1
          fi
      - name: Run SkillSpector review
        run: >-
          uv run --extra scan python -m skill_exchange.ci review
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha }}"
          --artifacts-dir review-artifacts
          --scan-mode "$SKILL_EXCHANGE_REVIEW_SCAN_MODE"
      - name: Add review to job summary
        if: always() && hashFiles('review-artifacts/comment.md') != ''
        run: cat review-artifacts/comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "skillspector-review-${{ github.event.pull_request.number }}"
          path: review-artifacts/
          if-no-files-found: warn

  publish:
    name: Publish official evidence
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SKILL_EXCHANGE_PUBLISH_SCAN_MODES: "static-only,llm-assisted"
      SKILL_EXCHANGE_LLM_API_KEY: "${{ secrets.SKILL_EXCHANGE_LLM_API_KEY }}"
      SKILL_EXCHANGE_LLM_BASE_URL: "${{ vars.SKILL_EXCHANGE_LLM_BASE_URL }}"
      SKILL_EXCHANGE_LLM_MODEL: "${{ vars.SKILL_EXCHANGE_LLM_MODEL }}"
      SKILL_EXCHANGE_LLM_PROVIDER: "${{ vars.SKILL_EXCHANGE_LLM_PROVIDER }}"
      EXCHANGE_PUBLISH_COMMIT: "true"
      EXCHANGE_PUBLISH_PUSH: "true"
      EXCHANGE_PUBLISH_BRANCH: "${{ github.event.repository.default_branch }}"
      EXCHANGE_PUBLISH_TOKEN: "${{ github.token }}"
      EXCHANGE_PUBLISH_USERNAME: "x-access-token"
      EXCHANGE_BOT_GIT_NAME: "github-actions[bot]"
      EXCHANGE_BOT_GIT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
      CI_SERVER_PROTOCOL: "https"
      CI_SERVER_HOST: "github.com"
      CI_PROJECT_PATH: "${{ github.repository }}"
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: "${{ github.event.repository.default_branch }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --no-cache-dir uv
      - name: Validate LLM gateway configuration
        run: |
          required=(
            SKILL_EXCHANGE_LLM_API_KEY
            SKILL_EXCHANGE_LLM_BASE_URL
            SKILL_EXCHANGE_LLM_MODEL
            SKILL_EXCHANGE_LLM_PROVIDER
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions configuration is missing: ${name}"
              exit 1
            fi
          done
          if [ "$SKILL_EXCHANGE_LLM_PROVIDER" != "openai_compatible" ]; then
            echo "::error::SKILL_EXCHANGE_LLM_PROVIDER must be openai_compatible for this workflow"
            exit 1
          fi
      - name: Show SkillSpector version
        run: uv run --extra scan skillspector --version
      - name: Publish exchange evidence
        run: >-
          uv run --extra scan python -m skill_exchange.ci publish
          --scan-modes "$SKILL_EXCHANGE_PUBLISH_SCAN_MODES"
          --result-path publish-result.json
      - name: Add publication result to job summary
        if: always() && hashFiles('publish-result.json') != ''
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat publish-result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload publication artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-exchange-publication
          path: |
            .exchange/generated/
            publish-result.json
          if-no-files-found: warn
          include-hidden-files: true
