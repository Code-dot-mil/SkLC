name: SkillSpector

on:
  pull_request:
    branches: ["main"]
    paths:
      - "skills/**"
  push:
    branches: ["main"]
    paths:
      - "skills/**"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "skillspector-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  review:
    name: Review changed skills
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      SKILL_EXCHANGE_REVIEW_SCAN_MODE: "${{ github.event.pull_request.head.repo.full_name == github.repository && 'llm-assisted' || 'static-only' }}"
      SKILL_EXCHANGE_REVIEW_FAIL_ON_VALIDATION_ERRORS: "true"
      SKILL_EXCHANGE_REVIEW_FAIL_ON_SCANNER_ERROR: "true"
      SKILL_EXCHANGE_LLM_API_KEY: "${{ secrets.SKILL_EXCHANGE_LLM_API_KEY }}"
      SKILL_EXCHANGE_LLM_BASE_URL: "${{ vars.SKILL_EXCHANGE_LLM_BASE_URL }}"
      SKILL_EXCHANGE_LLM_MODEL: "${{ vars.SKILL_EXCHANGE_LLM_MODEL }}"
      SKILL_EXCHANGE_LLM_PROVIDER: "${{ vars.SKILL_EXCHANGE_LLM_PROVIDER }}"
      NODE_EXTRA_CA_CERTS: "${{ vars.RUNNER_CA_BUNDLE_PATH }}"
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate runner CA bundle
        run: |
          if [ -z "${NODE_EXTRA_CA_CERTS:-}" ]; then
            echo "::error::Set the RUNNER_CA_BUNDLE_PATH Actions variable to a readable PEM CA bundle on the self-hosted runner."
            exit 1
          fi
          if [ ! -r "$NODE_EXTRA_CA_CERTS" ]; then
            echo "::error::The runner CA bundle is not readable: $NODE_EXTRA_CA_CERTS"
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --no-cache-dir uv
      - name: Validate LLM gateway configuration
        if: env.SKILL_EXCHANGE_REVIEW_SCAN_MODE == 'llm-assisted'
        run: |
          required=(
            SKILL_EXCHANGE_LLM_API_KEY
            SKILL_EXCHANGE_LLM_BASE_URL
            SKILL_EXCHANGE_LLM_MODEL
            SKILL_EXCHANGE_LLM_PROVIDER
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions configuration is missing: ${name}"
              exit 1
            fi
          done
          if [ "$SKILL_EXCHANGE_LLM_PROVIDER" != "openai_compatible" ]; then
            echo "::error::SKILL_EXCHANGE_LLM_PROVIDER must be openai_compatible for this workflow"
            exit 1
          fi
      - name: Run SkillSpector review
        run: >-
          uv run --extra scan python -m skill_exchange.ci review
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha }}"
          --artifacts-dir review-artifacts
          --scan-mode "$SKILL_EXCHANGE_REVIEW_SCAN_MODE"
      - name: Add review to job summary
        if: always() && hashFiles('review-artifacts/comment.md') != ''
        run: cat review-artifacts/comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post review to pull request
        if: >-
          always() && hashFiles('review-artifacts/comment.md') != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          PULL_REQUEST_NUMBER: "${{ github.event.pull_request.number }}"
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const https = require("node:https");

          const body = fs.readFileSync("review-artifacts/comment.md", "utf8");
          const payload = Buffer.from(JSON.stringify({body}));
          const request = https.request(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${process.env.PULL_REQUEST_NUMBER}/comments`,
            {
              method: "POST",
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                "content-length": payload.length,
                "content-type": "application/json",
                "user-agent": "skill-exchange-review",
                "x-github-api-version": "2022-11-28",
              },
            },
            (response) => {
              let responseBody = "";
              response.setEncoding("utf8");
              response.on("data", (chunk) => { responseBody += chunk; });
              response.on("end", () => {
                if (response.statusCode < 200 || response.statusCode >= 300) {
                  console.error(`GitHub comment request failed with HTTP ${response.statusCode}: ${responseBody}`);
                  process.exitCode = 1;
                }
              });
            },
          );
          request.on("error", (error) => {
            console.error(`GitHub comment request failed: ${error.message}`);
            process.exitCode = 1;
          });
          request.end(payload);
          NODE
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "skillspector-review-${{ github.event.pull_request.number }}"
          path: review-artifacts/
          if-no-files-found: warn

  publish:
    name: Publish official evidence
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SKILL_EXCHANGE_PUBLISH_SCAN_MODES: "static-only,llm-assisted"
      SKILL_EXCHANGE_LLM_API_KEY: "${{ secrets.SKILL_EXCHANGE_LLM_API_KEY }}"
      SKILL_EXCHANGE_LLM_BASE_URL: "${{ vars.SKILL_EXCHANGE_LLM_BASE_URL }}"
      SKILL_EXCHANGE_LLM_MODEL: "${{ vars.SKILL_EXCHANGE_LLM_MODEL }}"
      SKILL_EXCHANGE_LLM_PROVIDER: "${{ vars.SKILL_EXCHANGE_LLM_PROVIDER }}"
      NODE_EXTRA_CA_CERTS: "${{ vars.RUNNER_CA_BUNDLE_PATH }}"
      EXCHANGE_PUBLISH_COMMIT: "true"
      EXCHANGE_PUBLISH_PUSH: "true"
      EXCHANGE_PUBLISH_BRANCH: "${{ github.event.repository.default_branch }}"
      EXCHANGE_PUBLISH_TOKEN: "${{ github.token }}"
      EXCHANGE_PUBLISH_USERNAME: "x-access-token"
      EXCHANGE_BOT_GIT_NAME: "github-actions[bot]"
      EXCHANGE_BOT_GIT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
      CI_SERVER_PROTOCOL: "https"
      CI_SERVER_HOST: "github.com"
      CI_PROJECT_PATH: "${{ github.repository }}"
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: "${{ github.event.repository.default_branch }}"
      - name: Validate runner CA bundle
        run: |
          if [ -z "${NODE_EXTRA_CA_CERTS:-}" ]; then
            echo "::error::Set the RUNNER_CA_BUNDLE_PATH Actions variable to a readable PEM CA bundle on the self-hosted runner."
            exit 1
          fi
          if [ ! -r "$NODE_EXTRA_CA_CERTS" ]; then
            echo "::error::The runner CA bundle is not readable: $NODE_EXTRA_CA_CERTS"
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --no-cache-dir uv
      - name: Validate LLM gateway configuration
        run: |
          required=(
            SKILL_EXCHANGE_LLM_API_KEY
            SKILL_EXCHANGE_LLM_BASE_URL
            SKILL_EXCHANGE_LLM_MODEL
            SKILL_EXCHANGE_LLM_PROVIDER
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions configuration is missing: ${name}"
              exit 1
            fi
          done
          if [ "$SKILL_EXCHANGE_LLM_PROVIDER" != "openai_compatible" ]; then
            echo "::error::SKILL_EXCHANGE_LLM_PROVIDER must be openai_compatible for this workflow"
            exit 1
          fi
      - name: Show SkillSpector version
        run: uv run --extra scan skillspector --version
      - name: Publish exchange evidence
        run: >-
          uv run --extra scan python -m skill_exchange.ci publish
          --scan-modes "$SKILL_EXCHANGE_PUBLISH_SCAN_MODES"
          --result-path publish-result.json
      - name: Add publication result to job summary
        if: always() && hashFiles('publish-result.json') != ''
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat publish-result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload publication artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-exchange-publication
          path: |
            .exchange/generated/
            publish-result.json
          if-no-files-found: warn
          include-hidden-files: true
