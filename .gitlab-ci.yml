stages:
  - lint
  - test
  - audit
  - review
  - publish
  - deploy
  - package

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  GIT_DEPTH: "0"
  PYTHON_IMAGE_REGISTRY: "docker.io"
  PYTHON_IMAGE_REPOSITORY: "library/python"
  PYTHON_IMAGE_TAG: "3.12-bookworm"
  PYTHON_IMAGE: "$PYTHON_IMAGE_REGISTRY/$PYTHON_IMAGE_REPOSITORY:$PYTHON_IMAGE_TAG"
  PYTHON_BOOTSTRAP_COMMAND: "python -m pip install --no-cache-dir uv"
  NODE_IMAGE_REGISTRY: "docker.io"
  NODE_IMAGE_REPOSITORY: "library/node"
  NODE_IMAGE_TAG: "22-bookworm-slim"
  NODE_IMAGE: "$NODE_IMAGE_REGISTRY/$NODE_IMAGE_REPOSITORY:$NODE_IMAGE_TAG"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.npm"
  PYTHON_AUDIT_COMMAND: "uv run --with pip-audit pip-audit --progress-spinner off"
  NPM_AUDIT_LEVEL: "high"
  SKILL_EXCHANGE_RUNNER_TAG: "mitre-no-cui"
  PAGES_RUNNER_TAG: "pages-no-cui"
  SKILLSPECTOR_INSTALL_COMMAND: ""
  SKILL_EXCHANGE_REVIEW_SCAN_MODE: "static-only"
  SKILL_EXCHANGE_REVIEW_FAIL_ON_VALIDATION_ERRORS: "true"
  SKILL_EXCHANGE_REVIEW_FAIL_ON_SCANNER_ERROR: "false"
  SKILL_EXCHANGE_POST_REVIEW_COMMENT: "false"
  SKILL_EXCHANGE_REVIEW_TOKEN_VARIABLE: "GITLAB_TOKEN"
  SKILL_EXCHANGE_REVIEW_TOKEN_HEADER: ""
  SKILL_EXCHANGE_PUBLISH_SCAN_MODES: "static-only"
  SKILL_EXCHANGE_SHOW_SOURCE_LINKS: "true"
  EXCHANGE_PUBLISH_COMMIT: "false"
  EXCHANGE_PUBLISH_PUSH: "true"
  EXCHANGE_PUBLISH_BRANCH: "$CI_DEFAULT_BRANCH"
  EXCHANGE_PUBLISH_USERNAME: ""
  EXCHANGE_PUBLISH_PUSH_URL: ""
  EXCHANGE_PUBLISH_TOKEN: ""
  EXCHANGE_BOT_GIT_NAME: "skill-exchange-bot"
  EXCHANGE_BOT_GIT_EMAIL: "skill-exchange-bot@example.invalid"
  EXCHANGE_PUBLISH_COMMIT_MESSAGE: "chore: update generated exchange evidence"

.site_code_changes: &site_code_changes
  - ".gitlab-ci.yml"
  - ".exchange/*.json"
  - ".exchange/*.yaml"
  - "package.json"
  - "pyproject.toml"
  - "scripts/**/*"
  - "site/**/*"
  - "tests/**/*"
  - "uv.lock"

.site_code_rules: &site_code_rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: *site_code_changes
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    changes: *site_code_changes

.python_job:
  image: "$PYTHON_IMAGE"
  tags:
    - "$SKILL_EXCHANGE_RUNNER_TAG"
  before_script:
    - if [ -n "$PYTHON_BOOTSTRAP_COMMAND" ]; then sh -c "$PYTHON_BOOTSTRAP_COMMAND"; fi
    - uv --version
    - uv sync --extra test
  cache:
    key: "uv-$CI_COMMIT_REF_SLUG"
    paths:
      - ".uv-cache/"

.node_job:
  image: "$NODE_IMAGE"
  tags:
    - "$SKILL_EXCHANGE_RUNNER_TAG"
  before_script:
    - node --version
    - npm --version
    - npm ci --prefix site --cache "$NPM_CACHE_DIR" --prefer-offline
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - ".npm/"

lint:python:
  extends: .python_job
  stage: lint
  rules: *site_code_rules
  script:
    - uv run ruff check scripts tests
    - uv run python -m compileall scripts tests
    - uv run python -c "import yaml; yaml.safe_load(open('.gitlab-ci.yml'))"

lint:site:
  extends: .node_job
  stage: lint
  rules: *site_code_rules
  script:
    - npm --prefix site run lint

test:python:
  extends: .python_job
  stage: test
  rules: *site_code_rules
  script:
    - uv run pytest

test:site:
  extends: .node_job
  stage: test
  rules: *site_code_rules
  script:
    - npm --prefix site run test

audit:python:
  extends: .python_job
  stage: audit
  rules: *site_code_rules
  script:
    - $PYTHON_AUDIT_COMMAND

audit:site:
  extends: .node_job
  stage: audit
  rules: *site_code_rules
  script:
    - npm audit --prefix site --audit-level "$NPM_AUDIT_LEVEL"

review:skills:
  extends: .python_job
  stage: review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "skills/**/*"
  before_script:
    - if [ -n "$PYTHON_BOOTSTRAP_COMMAND" ]; then sh -c "$PYTHON_BOOTSTRAP_COMMAND"; fi
    - uv --version
    - uv sync --extra test
    - if [ -n "$SKILLSPECTOR_INSTALL_COMMAND" ]; then sh -c "$SKILLSPECTOR_INSTALL_COMMAND"; fi
    - if ! command -v skillspector >/dev/null 2>&1 && [ -z "${SKILLSPECTOR_BIN:-}" ]; then echo "Set SKILLSPECTOR_BIN or SKILLSPECTOR_INSTALL_COMMAND, or use an image with skillspector on PATH."; exit 2; fi
  script:
    - uv run python -m skill_exchange.ci review --artifacts-dir review-artifacts
  artifacts:
    when: always
    expire_in: "1 week"
    paths:
      - "review-artifacts/"

publish:exchange:
  extends: .python_job
  stage: publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "skills/**/*"
  variables:
    EXCHANGE_PUBLISH_COMMIT: "true"
  before_script:
    - if [ -n "$PYTHON_BOOTSTRAP_COMMAND" ]; then sh -c "$PYTHON_BOOTSTRAP_COMMAND"; fi
    - uv --version
    - uv sync --extra test
    - if [ -n "$SKILLSPECTOR_INSTALL_COMMAND" ]; then sh -c "$SKILLSPECTOR_INSTALL_COMMAND"; fi
    - if ! command -v skillspector >/dev/null 2>&1 && [ -z "${SKILLSPECTOR_BIN:-}" ]; then echo "Set SKILLSPECTOR_BIN or SKILLSPECTOR_INSTALL_COMMAND, or use an image with skillspector on PATH."; exit 2; fi
  script:
    - uv run python -m skill_exchange.ci publish --result-path publish-result.json
  artifacts:
    when: always
    expire_in: "1 week"
    paths:
      - ".exchange/generated/"
      - "publish-result.json"

generate:exchange:
  extends: .python_job
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "skills/**/*"
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  before_script:
    - if [ -n "$PYTHON_BOOTSTRAP_COMMAND" ]; then sh -c "$PYTHON_BOOTSTRAP_COMMAND"; fi
    - uv --version
    - uv sync --extra test
    - if [ -n "$SKILLSPECTOR_INSTALL_COMMAND" ]; then sh -c "$SKILLSPECTOR_INSTALL_COMMAND"; fi
    - if ! command -v skillspector >/dev/null 2>&1 && [ -z "${SKILLSPECTOR_BIN:-}" ]; then echo "Set SKILLSPECTOR_BIN or SKILLSPECTOR_INSTALL_COMMAND, or use an image with skillspector on PATH."; exit 2; fi
  script:
    - uv run python -m skill_exchange.ci publish --result-path generate-result.json
  artifacts:
    when: always
    expire_in: "1 week"
    paths:
      - ".exchange/generated/"
      - "generate-result.json"

pages:
  extends: .node_job
  stage: deploy
  tags:
    - "$PAGES_RUNNER_TAG"
  needs:
    - job: "publish:exchange"
      artifacts: true
      optional: true
    - job: "generate:exchange"
      artifacts: true
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  script:
    - npm --prefix site run build
    - rm -rf public
    - cp -R site/dist public
  artifacts:
    paths:
      - "public/"

package:github-pages:
  image: "$NODE_IMAGE"
  stage: package
  tags:
    - "$SKILL_EXCHANGE_RUNNER_TAG"
  needs:
    - job: "pages"
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  script:
    - mkdir -p .github/workflows
    - |
      cat > README.md <<'MARKDOWN'
      # Skill Exchange GitHub Pages

      This repository contains a prebuilt Skill Exchange site generated by GitLab CI. GitHub Actions publishes the contents of `public/` to GitHub Pages; no local build or package installation is required.

      ## Repository Contents

      - `public/` contains the prebuilt static site.
      - `.github/workflows/gh-pages.yml` deploys the site whenever `main` is updated.

      ## First-Time Setup

      1. Extract the artifact into the root of an empty GitHub repository. Keep the hidden `.github/` directory.
      2. Commit the extracted files and push them to the repository's `main` branch.
      3. Open the repository's **Actions** tab and wait for **Deploy Skill Exchange to GitHub Pages** to finish. The workflow creates or updates the `gh-pages` branch.
      4. Open **Settings > Pages**.
      5. Under **Build and deployment**, select **Deploy from a branch**.
      6. Select the `gh-pages` branch and `/(root)` folder, then save.
      7. After GitHub finishes publishing, use the site URL shown in **Settings > Pages**.

      The workflow automatically configures links for a GitHub project site such as `https://owner.github.io/repository/`. Repositories named `owner.github.io` remain configured for the root path.

      ## Publish an Updated Artifact

      Replace the existing `public/`, `.github/workflows/gh-pages.yml`, and `README.md` with the files from the new artifact, commit them, and push `main`. The workflow republishes the site automatically.

      ## Troubleshooting

      - If the workflow does not start, confirm GitHub Actions is enabled for the repository and that the files were pushed to `main`.
      - If the workflow cannot update `gh-pages`, confirm repository or organization policy allows workflows to write repository contents.
      - If the page returns 404 after a successful workflow, confirm **Settings > Pages** uses the `gh-pages` branch and `/(root)` folder.
      MARKDOWN
    - |
      cat > .github/workflows/gh-pages.yml <<'YAML'
      name: Deploy Skill Exchange to GitHub Pages

      on:
        push:
          branches:
            - main

      permissions:
        contents: write

      jobs:
        deploy:
          runs-on: ubuntu-latest
          steps:
            - name: Checkout site artifact
              uses: actions/checkout@v4
            - name: Configure GitHub project site paths
              if: ${{ !endsWith(github.event.repository.name, '.github.io') }}
              env:
                GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
              shell: bash
              run: |
                node <<'NODE'
                const { extname, join } = require("node:path");
                const { readdirSync, readFileSync, statSync, writeFileSync } = require("node:fs");

                const basePath = process.env.GITHUB_PAGES_BASE_PATH;
                const supportedExtensions = new Set([".css", ".html", ".js"]);

                function* walk(directory) {
                  for (const entry of readdirSync(directory)) {
                    const path = join(directory, entry);
                    if (statSync(path).isDirectory()) {
                      yield* walk(path);
                    } else {
                      yield path;
                    }
                  }
                }

                for (const path of walk("public")) {
                  if (!supportedExtensions.has(extname(path))) {
                    continue;
                  }

                  const content = readFileSync(path, "utf8");
                  const updated = content
                    .replace(/(?<![A-Za-z0-9:])\/_astro\//g, `${basePath}/_astro/`)
                    .replace(/(?<![A-Za-z0-9:])\/skills\//g, `${basePath}/skills/`)
                    .replace(/(?<![A-Za-z0-9:])\/downloads\//g, `${basePath}/downloads/`)
                    .replaceAll('href="/"', `href="${basePath}/"`);

                  if (updated !== content) {
                    writeFileSync(path, updated);
                  }
                }
                NODE
            - name: Deploy prebuilt site
              uses: peaceiris/actions-gh-pages@v4
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: ./public
      YAML
  artifacts:
    name: "github-pages-$CI_COMMIT_SHORT_SHA"
    expire_in: "1 week"
    paths:
      - "public/"
      - ".github/workflows/gh-pages.yml"
      - "README.md"
