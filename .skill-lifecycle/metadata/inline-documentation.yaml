schema_version: "0.2"
skill_id: "inline-documentation"
tier: "T1"
owner: "ai4sdlc-skills-team"
purpose: "Help software developers add accurate, maintainable code-adjacent documentation without burying defects under comments."
intended_users:
  - "software-developer"
use_context: "IDE-based coding assistant during feature, bugfix, refactoring, review-response, or maintenance work where code-adjacent documentation needs to explain intent, contracts, or constraints."
positive_triggers:
  - id: "PT-001"
    description: "User asks to add, improve, or review comments, docstrings, JSDoc, TSDoc, or inline documentation for source code."
  - id: "PT-002"
    description: "User asks to clarify non-obvious code behavior, invariants, side effects, public API contracts, or maintenance constraints near the code."
  - id: "PT-003"
    description: "User asks to address review feedback requesting clearer code comments or docstrings."
negative_triggers:
  - id: "NT-001"
    description: "User asks for a standalone design document, tutorial, release note, changelog, commit message, or PR/MR description."
  - id: "NT-002"
    description: "User asks only for production code implementation with no documentation request or documentation-relevant review feedback."
  - id: "NT-003"
    description: "User asks for documentation that would merely restate obvious syntax or line-by-line behavior."
known_failure_cases:
  - id: "KF-001"
    description: "The agent cannot inspect enough surrounding code, tests, or callers to verify the behavior being documented."
  - id: "KF-002"
    description: "The code behavior is ambiguous or inconsistent, so documentation would encode an unconfirmed guess."
  - id: "KF-003"
    description: "The requested comment would hide a confusing or unsafe implementation that should be fixed directly before documenting."
