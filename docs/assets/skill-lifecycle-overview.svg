<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title description">
  <title id="title">The skill lifecycle</title>
  <desc id="description">Define, Build, Validate, Release, and Operate progress from left to right. A revision path returns feedback from later stages to Define.</desc>
  <defs>
    <marker id="forward" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .stage { font-size: 23px; font-weight: 700; letter-spacing: 1px; }
      .number { font-size: 22px; font-weight: 700; fill: white; text-anchor: middle; }
      .question { font-size: 17px; fill: #334155; text-anchor: middle; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#forward); }
    </style>
  </defs>
  <rect width="1200" height="290" rx="16" fill="#ffffff"/>
  <g>
    <rect x="20" y="45" width="200" height="155" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="120" cy="46" r="22" fill="#1d4ed8"/>
    <text x="120" y="54" class="number">1</text>
    <text x="120" y="112" class="stage" fill="#1d4ed8" text-anchor="middle">DEFINE</text>
    <text x="120" y="145" class="question"><tspan x="120">What is this</tspan><tspan x="120" dy="24">skill for?</tspan></text>
  </g>
  <path d="M 231 123 H 250" class="arrow"/>
  <g>
    <rect x="260" y="45" width="200" height="155" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <circle cx="360" cy="46" r="22" fill="#15803d"/>
    <text x="360" y="54" class="number">2</text>
    <text x="360" y="112" class="stage" fill="#15803d" text-anchor="middle">BUILD</text>
    <text x="360" y="145" class="question"><tspan x="360">What does it</tspan><tspan x="360" dy="24">need to do?</tspan></text>
  </g>
  <path d="M 471 123 H 490" class="arrow"/>
  <g>
    <rect x="500" y="45" width="200" height="155" rx="14" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
    <circle cx="600" cy="46" r="22" fill="#7e22ce"/>
    <text x="600" y="54" class="number">3</text>
    <text x="600" y="112" class="stage" fill="#7e22ce" text-anchor="middle">VALIDATE</text>
    <text x="600" y="145" class="question"><tspan x="600">Does it work</tspan><tspan x="600" dy="24">as intended?</tspan></text>
  </g>
  <path d="M 711 123 H 730" class="arrow"/>
  <g>
    <rect x="740" y="45" width="200" height="155" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <circle cx="840" cy="46" r="22" fill="#c2410c"/>
    <text x="840" y="54" class="number">4</text>
    <text x="840" y="112" class="stage" fill="#c2410c" text-anchor="middle">RELEASE</text>
    <text x="840" y="145" class="question"><tspan x="840">Is it ready</tspan><tspan x="840" dy="24">to share?</tspan></text>
  </g>
  <path d="M 951 123 H 970" class="arrow"/>
  <g>
    <rect x="980" y="45" width="200" height="155" rx="14" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
    <circle cx="1080" cy="46" r="22" fill="#0e7490"/>
    <text x="1080" y="54" class="number">5</text>
    <text x="1080" y="112" class="stage" fill="#0e7490" text-anchor="middle">OPERATE</text>
    <text x="1080" y="145" class="question"><tspan x="1080">Is it still</tspan><tspan x="1080" dy="24">fit for use?</tspan></text>
  </g>
  <path d="M 1080 212 V 240 H 120 V 213" class="arrow"/>
  <path d="M 360 212 V 240 M 600 212 V 240 M 840 212 V 240" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <text x="600" y="271" font-size="16" font-weight="700" letter-spacing="1.5" fill="#475569" text-anchor="middle">REVISE AS NEEDED</text>
</svg>
