# Include locally; provide an image with Python 3.12+, pip and SkillSpector on PATH.
.assessment-runtime:
  image: "$ASSESSMENT_IMAGE"
  tags: ["$ASSESSMENT_RUNNER_TAG"]
  before_script:
    - python -m pip install wheels/*.whl

.skill-advice:
  extends: .assessment-runtime
  script:
    - skill-assessment advise --skill "$SKILL_DIRECTORY" --output-dir "$ADVICE_OUTPUT" --scan-mode "$SCAN_MODE"

.skill-assessment:
  extends: .assessment-runtime
  script:
    - skill-assessment assess --skill "$SKILL_DIRECTORY" --output-dir "$ASSESSMENT_OUTPUT" --scan-mode "$SCAN_MODE"
