[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-assessment"
version = "1.1.0"
description = "Validate and assess an explicitly selected agent skill package."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.2",
]

[project.scripts]
skill-assessment = "skill_assessment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_assessment = ["prompts/*.md"]

[project.optional-dependencies]
test = ["pytest>=8.2", "ruff>=0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
