[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-assessment"
version = "0.1.0"
description = "Validate and advise on an explicitly selected agent skill package."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.2",
]

[project.scripts]
skill-assessment = "skill_assessment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
