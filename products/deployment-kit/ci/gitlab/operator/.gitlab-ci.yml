include:
  - local: ci/assessment.yml

stages: [assess, generate, build, deploy]

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  GIT_DEPTH: "0"
  SCAN_MODE: llm-assisted
  NODE_IMAGE: node:22
  PAGES_IMAGE: alpine:3.24.2

.operator-runtime:
  extends: .assessment-runtime
  before_script:
    - |
      if [ "${ASSESSMENT_CA_CERTIFICATES+x}" = x ]; then
        ASSESSMENT_TRUST_DIR="$(mktemp -d)"
        python ci/configure_runtime_trust.py "$ASSESSMENT_TRUST_DIR/ca-bundle.pem"
        export SSL_CERT_FILE="$ASSESSMENT_TRUST_DIR/ca-bundle.pem"
        export REQUESTS_CA_BUNDLE="$SSL_CERT_FILE" PIP_CERT="$SSL_CERT_FILE"
      fi
    - !reference [.assessment-runtime, before_script]

assess:
  extends: .operator-runtime
  stage: assess
  dependencies: []
  script:
    - python -m skill_exchange.cli assess-catalog --scan-mode "$SCAN_MODE"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [evidence/]

generate:
  extends: .operator-runtime
  stage: generate
  dependencies: [assess]
  script:
    - python -m skill_exchange.cli generate
  artifacts:
    paths: [.exchange/generated/]

build:
  stage: build
  image: "$NODE_IMAGE"
  tags: ["$BUILD_RUNNER_TAG"]
  dependencies: [generate]
  script:
    - npm ci --prefix site
    - npm --prefix site run lint
    - SKILL_EXCHANGE_GENERATED_ROOT="$CI_PROJECT_DIR/.exchange/generated" npm --prefix site run build
    - cp -R site/dist public
  artifacts:
    paths: [public/]

pages:
  stage: deploy
  image: "$PAGES_IMAGE"
  tags: ["$PAGES_RUNNER_TAG"]
  dependencies: [build]
  script:
    - test -s public/index.html
  artifacts:
    paths: [public/]
