include:
  - local: ci/assessment.yml

stages: [advise, assess, generate, build, deploy]

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  PYTHONPATH: scripts
  GIT_DEPTH: "0"
  SCAN_MODE: llm-assisted
  NODE_IMAGE: node:22
  PAGES_IMAGE: alpine:3.24.2
  SKILL_EXCHANGE_SOURCE_REPOSITORY_URL: "$CI_PROJECT_URL"
  SKILL_EXCHANGE_SOURCE_BRANCH: "$CI_COMMIT_SHA"

advise:
  extends: .skill-advice
  stage: advise
  script:
    - python -m skill_exchange.operator advise --evidence advice --scan-mode "$SCAN_MODE"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [advice/]

assess:
  extends: .skill-assessment
  stage: assess
  dependencies: []
  script:
    - python -m skill_exchange.operator assess --scan-mode "$SCAN_MODE"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [evidence/]

generate:
  extends: .assessment-runtime
  stage: generate
  dependencies: [assess]
  script:
    - python -m skill_exchange.operator generate --scan-mode "$SCAN_MODE"
  artifacts:
    paths: [.exchange/generated/]

build:
  stage: build
  image: "$NODE_IMAGE"
  tags: ["$BUILD_RUNNER_TAG"]
  dependencies: [generate]
  script:
    - npm ci --prefix site
    - npm --prefix site run lint
    - npm --prefix site run build
    - cp -R site/dist public
  artifacts:
    paths: [public/]

pages:
  stage: deploy
  image: "$PAGES_IMAGE"
  tags: ["$PAGES_RUNNER_TAG"]
  dependencies: [build]
  script:
    - test -s public/index.html
  artifacts:
    paths: [public/]
