stages:
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

pages:
  stage: deploy
  tags:
    - "$PAGES_RUNNER_TAG"
  script:
    - test -s public/index.html
    - test -s release-manifest.json
    - test -s SHA256SUMS.txt
    - test -s contracts/release-manifest/v1/release-manifest.schema.json
    - |
      python3 - <<'PY'
      import hashlib
      import json
      import pathlib
      import re
      from datetime import datetime

      root = pathlib.Path.cwd()
      manifest = json.loads((root / "release-manifest.json").read_text())
      schema = json.loads((root / "contracts/release-manifest/v1/release-manifest.schema.json").read_text())
      required = set(schema["required"])
      allowed = set(schema["properties"])
      if not required <= set(manifest) or not set(manifest) <= allowed:
          raise SystemExit("release-manifest.json does not conform to the vendored schema fields")
      if manifest.get("schema_version") != "skill-exchange-release-manifest/v1":
          raise SystemExit("release-manifest.json has an unsupported schema version")
      if manifest.get("product") != "deployment-kit-prebuilt":
          raise SystemExit("release-manifest.json is not for deployment-kit-prebuilt")
      for field in ("version", "source_revision"):
          if not isinstance(manifest.get(field), str) or not manifest[field]:
              raise SystemExit(f"release-manifest.json has an invalid {field}")
      try:
          created_at = datetime.fromisoformat(manifest["created_at"].replace("Z", "+00:00"))
      except (KeyError, TypeError, ValueError) as error:
          raise SystemExit("release-manifest.json has an invalid created_at") from error
      if created_at.utcoffset() is None:
          raise SystemExit("release-manifest.json created_at must include a timezone")
      for field in ("produces", "consumes"):
          contracts = manifest.get(field)
          if not isinstance(contracts, dict):
              raise SystemExit(f"release-manifest.json has an invalid {field}")
          if any(
              not isinstance(name, str)
              or not name
              or not isinstance(versions, list)
              or not versions
              or any(not isinstance(version, str) or not version for version in versions)
              or len(versions) != len(set(versions))
              for name, versions in contracts.items()
          ):
              raise SystemExit(f"release-manifest.json has an invalid {field}")
      if "components" in manifest and (
          not isinstance(manifest["components"], dict)
          or any(not isinstance(value, str) or not value for value in manifest["components"].values())
      ):
          raise SystemExit("release-manifest.json has invalid components")
      if not isinstance(manifest.get("artifacts"), list) or not manifest["artifacts"]:
          raise SystemExit("release-manifest.json has no artifacts")

      recorded = {}
      for entry in manifest["artifacts"]:
          if not isinstance(entry, dict) or set(entry) != {"path", "sha256"}:
              raise SystemExit("release-manifest.json has an invalid artifact entry")
          path = entry.get("path", "")
          if not isinstance(path, str):
              raise SystemExit("release-manifest.json has a non-string artifact path")
          encoded_digest = entry.get("sha256", "")
          if not isinstance(encoded_digest, str) or not re.fullmatch(r"sha256:[a-f0-9]{64}", encoded_digest):
              raise SystemExit(f"invalid manifest digest: {path}")
          digest = encoded_digest.removeprefix("sha256:")
          parts = pathlib.PurePosixPath(path).parts
          if not path or path.startswith("/") or ".." in parts:
              raise SystemExit(f"unsafe manifest path: {path}")
          if path in recorded:
              raise SystemExit(f"duplicate manifest path: {path}")
          target = root / pathlib.PurePosixPath(path)
          if not target.is_file():
              raise SystemExit(f"invalid manifest entry: {path}")
          actual = hashlib.sha256(target.read_bytes()).hexdigest()
          if actual != digest:
              raise SystemExit(f"checksum mismatch: {path}")
          recorded[path] = digest

      checksums = {}
      for line in (root / "SHA256SUMS.txt").read_text().splitlines():
          digest, path = line.split("  ", 1)
          if not re.fullmatch(r"[a-f0-9]{64}", digest):
              raise SystemExit(f"invalid checksum entry: {path}")
          if path in checksums:
              raise SystemExit(f"duplicate checksum path: {path}")
          checksums[path] = digest
      if checksums != recorded:
          raise SystemExit("release-manifest.json and SHA256SUMS.txt do not match")

      download_root = (root / "public" / "downloads").resolve()
      if not download_root.is_dir():
          raise SystemExit("public/downloads is missing")
      reference_pattern = re.compile(r'(?:href|src)=["\x27](downloads/[^"\x27?#]+)|["\x27](downloads/[^"\x27?#]+)["\x27]')
      for pattern in ("*.html", "*.json", "*.js"):
          for source in (root / "public").rglob(pattern):
              source_text = source.read_text()
              if re.search(r'(?:href|src)=["\x27]/downloads/|["\x27]/downloads/', source_text):
                  raise SystemExit(f"site download references must be relative: {source}")
              for match in reference_pattern.finditer(source_text):
                  reference = match.group(1) or match.group(2)
                  target = (download_root / reference.removeprefix("downloads/")).resolve()
                  if download_root not in target.parents or not target.is_file():
                      raise SystemExit(f"missing or unsafe site download: {reference}")
      PY
  artifacts:
    paths:
      - public/
