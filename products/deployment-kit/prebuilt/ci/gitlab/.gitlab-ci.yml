stages:
  - deploy

variables:
  PAGES_IMAGE_REGISTRY: "docker.io"
  PAGES_IMAGE_REPOSITORY: "library/alpine"
  PAGES_IMAGE_TAG: "3.24.2"
  PAGES_IMAGE: "$PAGES_IMAGE_REGISTRY/$PAGES_IMAGE_REPOSITORY:$PAGES_IMAGE_TAG"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

pages:
  image: "$PAGES_IMAGE"
  stage: deploy
  tags:
    - "$PAGES_RUNNER_TAG"
  script:
    - echo "Publishing the prebuilt site from public/"
  artifacts:
    paths:
      - public/
