[project]
name = "skill-exchange-local"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "skill-assessment",
  "skill-deployment",
  "sklc-maintainer",
]

[project.optional-dependencies]
test = [
  "coverage>=7.17.3",
  "pytest>=9.2.0",
  "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.uv.sources]
skill-assessment = { path = "products/assessment-kit", editable = true }
skill-deployment = { path = "products/deployment-kit/operator", editable = true }
sklc-maintainer = { path = "maintainer", editable = true }

[tool.pytest.ini_options]
testpaths = ["products/assessment-kit/tests", "products/deployment-kit/operator/tests", "maintainer/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
lint = [
    "gitlab-ci-verify-bin>=2.11.14",
]
release = [
    "pygit2>=1.21.0",
    "pygithub>=2.10.0",
]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["skill_assessment", "skill_exchange", "sklc_maintainer"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "coverage/python/html"

[tool.coverage.xml]
output = "coverage/python/coverage.xml"

[tool.coverage.json]
output = "coverage/python/coverage.json"
