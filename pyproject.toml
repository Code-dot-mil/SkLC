[project]
name = "skill-exchange-local"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "skill-assessment",
  "skill-deployment",
  "sklc-maintainer",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.uv.sources]
skill-assessment = { path = "products/assessment-kit", editable = true }
skill-deployment = { path = "products/deployment-kit/operator", editable = true }
sklc-maintainer = { path = "maintainer", editable = true }

[tool.pytest.ini_options]
testpaths = ["products/assessment-kit/tests", "products/deployment-kit/operator/tests", "maintainer/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
release = [
    "pygit2>=1.20.1",
    "pygithub>=2.10.0",
]
